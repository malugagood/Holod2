name: Optimize product images

on:
  push:
    paths:
      - "images/**"
      - "index.html"
      - "product/**"
      - "scripts/optimize_images.py"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-product-images
  cancel-in-progress: false

jobs:
  optimize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pip Pillow

      - name: Convert JPEGs and update HTML
        run: python scripts/optimize_images.py

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html product/*.html images/
          if git diff --cached --quiet; then
            echo "No image optimization changes to commit."
            exit 0
          fi
          git commit -m "Optimize product photos and serve WebP"
          git push origin HEAD:main
